name: Keep backend warm

# Render's free tier spins the backend down after ~15 min idle, and the next
# request then eats a 30-50s cold start. Pinging it well under that window
# keeps it warm so real requests (e.g. the Environment photo analysis) don't
# look hung/broken on first use.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # GitHub often delays/skips scheduled runs, so the backend can still be
      # asleep when this fires and a cold start can exceed 60s. Allow a longer
      # wait and retry instead of failing on the first timeout (curl exit 28).
      - name: Ping backend health endpoint
        run: |
          curl -sSf --max-time 120 --retry 3 --retry-delay 15 --retry-all-errors \
            https://indelify-backend.onrender.com/ > /dev/null
