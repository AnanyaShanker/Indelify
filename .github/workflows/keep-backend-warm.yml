name: Keep backend warm

# Render's free tier spins the backend down after ~15 min idle, and the next
# request then eats a 30-50s cold start. Pinging it well under that window
# keeps it warm so real requests (e.g. the Environment photo analysis) don't
# look hung/broken on first use.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health endpoint
        run: curl -sf --max-time 60 https://indelify-backend.onrender.com/ > /dev/null
